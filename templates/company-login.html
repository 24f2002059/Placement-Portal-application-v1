<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>company-login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/company.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
        .page{
            background-image: url("{{ url_for('static', filename='images/company-login-banner.jpeg') }}");
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="black-cover">
            <div class="form-box">
                <h3 class="text-center mb-4 fw-bold">Company Login</h3>


                <form action="/company-login" method="POST">

                    <div class="mb-3">
                        <label for="adminEmail" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="adminEmail" name="email" placeholder="Enter email"
                            required>
                    </div>

                    <div class="mb-4">
                        <label for="adminPassword" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="adminPassword" name="password"
                            placeholder="Enter password" required>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">
                            Login
                        </button>
                    </div>
                    <div class="text-center">
                        <span>new user ? <a href="/company-register">Register here</a></span>
                    </div>

                </form>


            </div>
        </div>
    </div>


</body>

</html>
