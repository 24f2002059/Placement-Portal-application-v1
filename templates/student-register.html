<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student-login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .page {
            background-image: url("{{ url_for('static', filename='images/student-login-banner.jpeg') }}");
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="black-cover">
            <div class="form-box">
                <h2 class="text-center">Student Register</h2>
                <form action="/student-register" method="POST" enctype="multipart/form-data">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="Name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="Name" name="name">
                        </div>

                        <div class="col-md-6">
                            <label for="Email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="Email" name="email">
                        </div>
                    </div>


                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="academic_level" class="form-label">Academic Level</label>
                            <input type="option" class="form-control" id="academic_level" name="academic_level">
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone">
                        </div>
                    </div>


                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="github" class="form-label">Github link</label>
                            <input type="text" class="form-control" id="github" name="github">
                        </div>

                        <div class="col-md-6">
                            <label for="Password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="Password" name="password">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="mb-6">
                            <label for="resume" class="form-label">Resume</label>
                            <input class="form-control" type="file" id="resume" name="resume">
                        </div>
                    </div>
                    <div class="text-center">
                        <input type="submit" class="btn btn-primary" value="Register">
                    </div>
                    {% if error %}
                        <div class="alert alert-danger text-center">{{ error }}</div>
                    {% endif %}

                </form>
            </div>
        </div>


</body>

</html>
