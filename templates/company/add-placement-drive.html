<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/company.css') }}">
</head>

<body>
    <div class="dashboard-nav">
        <div class="nav-left">
            <img src="/static/images/home-logo.png" alt="home">
            <span>Company Dashboard</span>
        </div>
    </div>

    <div class="page-tabs">
        <a href="/company-dashboard/{{ company.id }}" class="active">Dashboard</a>
        <a href="/company-applications/{{ company.id }}">Applications</a>
        <a href="/company-placement-drive/{{ company.id }}">Placement Drive</a>
    </div>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <h2>Add New Placement Drive</h2>
        </div>
    </nav>

    <div class="drive-form">
        <div class="drive-form-box">
            <form action="/add-drive/{{ company.id }}" method="POST">
                <div class="row">

                    
                    <div class="col-md-6 mb-3">
                        <label for="job_title" class="form-label fw-semibold">Job Title</label>
                        <input type="text" class="form-control" id="job_title" name="job_title" placeholder="Enter job title">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="mode" class="form-label fw-semibold">Mode</label>
                        <select name="mode" id="mode" class="form-select">
                            <option value="">Select Mode</option>
                            <option value="onsite">Onsite</option>
                            <option value="remote">Remote</option>
                        </select>
                    </div>

                    
                    <div class="col-md-6 mb-3">
                        <label for="Package" class="form-label fw-semibold">Package</label>
                        <input type="number" class="form-control" id="Package" name="package"
                            placeholder="In per month">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="eligibility_criteria" class="form-label fw-semibold">Eligibility Criteria</label>
                        <input type="text" class="form-control" id="eligibility_criteria" name="eligibility_criteria"
                            placeholder="Enter eligibility criteria">
                    </div>

                    
                    <div class="col-md-6 mb-3">
                        <label for="Description" class="form-label fw-semibold">Description</label>
                        <input type="text" class="form-control" id="Description" name="description"
                            placeholder="Enter description">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="deadline" class="form-label fw-semibold">Deadline</label>
                        <input type="date" class="form-control" id="deadline" name="deadline" placeholder="Enter deadline">
                    </div>
                </div>
                <div class="text-center mt-4">
                    <input type="submit" class="btn btn-success px-4 me-2" value="Create">
                    <a href="/company-placement-drive/{{ company.id }}" class="btn btn-secondary px-4">
                        Cancel
                    </a>
                </div>
            </form>

        </div>


    </div>
</body>

</html>
