<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>
    <div class="dashboard-nav">
        <div class="nav-left">
            <img src="/static/images/home-logo.png" alt="home">
            <span>Dashboard</span>
        </div>
    </div>

    <div class="page-tabs">
        <a href="/admin-dashboard">Home</a>
        <a href="/admin-students">Students</a>
        <a href="/admin-companies">Companies</a>
        <a href="/admin-placement-drives" class="active">Placement Drive</a>
        <a href="/admin-applications">Applications</a>
    </div>
    <div class="student-info">
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <img src="/static/images/placement.png" class="logos me-2" alt="">
                    <h2 class="mb-0">Placement Drives</h2>
                </div>
                <form class="d-flex" role="search" action="/admin-placements-search" method="get">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"
                        name="search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>

            </div>
        </nav>
        <div class="applications-table">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th scope="col">id</th>
                        <th scope="col">job title</th>
                        <th scope="col">company</th>
                        <th scope="col">due date</th>
                        <th scope="col">status</th>
                        <th scope="col">actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for drive in placement_drives %}
                    <tr>
                        <th scope="row">{{ drive.id }}</th>
                        <td>{{ drive.job_title }}</td>
                        <td>{{ drive.company.name }}</td>
                        <td>{{ drive.deadline }}</td>
                        <td>{{ drive.status }}</td>
                        <td><a href="/admin-placement-drive-details/{{ drive.id }}" class="btn btn-sm btn-outline-primary">View Details</a>
                            <a href="/admin-delete-placement-drive/{{ drive.id }}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
