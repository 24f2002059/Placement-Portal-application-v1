<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>
    <div class="dashboard-nav">
        <div class="nav-left">
            <img src="/static/images/home-logo.png" alt="home">
            <span>Dashboard</span>
        </div>
    </div>

    <div class="page-tabs">
        <a href="/admin-dashboard">Home</a>
        <a href="/admin-students">Students</a>
        <a href="/admin-companies">Companies</a>
        <a href="/admin-placement-drives">Placement Drive</a>
        <a href="/admin-applications">Applications</a>
    </div>
    <div class="student-info">
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <img src="/static/images/company.png" class="logos me-2" alt="">
                    <h2 class="mb-0">Companies</h2>
                </div>
                <form class="d-flex" role="search" action="/search-companies" method="get">
                    <input class="form-control me-2" type="search" placeholder="Search by name or field" aria-label="Search"
                        name="search">
                    <input class="btn btn-outline-success" type="submit" value="Search">
                </form>

            </div>
        </nav>
        <div class="student-profiles">
            {% for company in companies %}
            <div class="profile">
                <div class="box1">
                    <img src="https://ui-avatars.com/api/?name={{ company.name}}&background=4e6fbf&color=ffffff" alt="Avatar" class="symbol">
                    <div>
                        <h4 style="color: aliceblue;">{{ company.name }}</h4>
                        <span>{{ company.field }}</span>
                    </div>
                </div>
                <div class="box2">
                    <span>Website :-</span>
                    <span style="color: aliceblue;"><a href="{{ company.website_link }}" target="_blank" style="color: aliceblue;">{{ company.website_link }}</a></span>
                    <div class="text-center">
                        <a href="/admin-company-details/{{ company.id }}" class="btn btn-info">View Details</a>
                    </div>
                </div>
            </div>
            {% endfor %}
            
        </div>
    </div>
</body>

</html>
